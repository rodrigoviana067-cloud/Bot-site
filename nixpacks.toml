# Nixpacks configuration for WA Affiliate Pro
# Instala Node.js 20 + Python 3.11 no mesmo container

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "gcc"]

[phases.build]
cmds = [
    "echo '=== Instalando Node.js dependencies ==='",
    "npm install",
    "echo '=== Instalando Python dependencies ==='",
    "pip install -r requirements.txt"
]

[start]
cmd = "bash start.sh"
